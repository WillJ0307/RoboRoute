name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, for example v1.2.0 or v1.2.0-beta
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-linux:
    uses: ./.github/workflows/build-linux.yml

  build-windows:
    uses: ./.github/workflows/build-windows.yml

  release:
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-22.04

    steps:
      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: NTOverAOA-linux-x86_64
          path: release-assets/linux

      - name: Download Linux ARM64 executable
        uses: actions/download-artifact@v4
        with:
          name: NTOverAOA-linux-arm64
          path: release-assets/linux

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: NTOverAOA-windows-x86_64
          path: release-assets/windows

      - name: Attach version to release filenames
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mv release-assets/linux/NTOverAOA-linux-x86_64.run \
            "release-assets/linux/NTOverAOA-linux-x86_64-${RELEASE_TAG}.run"
          mv release-assets/linux/NTOverAOA-linux-arm64.run \
            "release-assets/linux/NTOverAOA-linux-arm64-${RELEASE_TAG}.run"
          mv release-assets/windows/NTOverAOA.exe \
            "release-assets/windows/NTOverAOA-windows-x86_64-${RELEASE_TAG}.exe"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: NTOverAOA ${{ inputs.tag }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            On Linux, make the downloaded file executable before launching it:

            ```bash
            chmod +x NTOverAOA-linux-x86_64-${{ inputs.tag }}.run
            ./NTOverAOA-linux-x86_64-${{ inputs.tag }}.run

            chmod +x NTOverAOA-linux-arm64-${{ inputs.tag }}.run
            ./NTOverAOA-linux-arm64-${{ inputs.tag }}.run
            ```
          files: |
            release-assets/linux/NTOverAOA-linux-x86_64-${{ inputs.tag }}.run
            release-assets/linux/NTOverAOA-linux-arm64-${{ inputs.tag }}.run
            release-assets/windows/NTOverAOA-windows-x86_64-${{ inputs.tag }}.exe