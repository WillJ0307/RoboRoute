name: Build Android APK

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Step 2: Set up the Java JDK environment (Required for Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 3: Grant execute permission to the Gradle Wrapper
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Restore debug keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      # Step 4: Build the Debug APK using Gradle
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Step 5: Upload the compiled APK so you can download it from GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
